version: 3

dotenv: ["maildebug.env", ".env"]

tasks:
    default: task --list-all

    client:
        dir: ui
        cmds:
            - bun dev

    client:build:
        dir: ui
        cmds:
            - bun run build

    format:
        cmds:
            - bun run format

    server:
        cmds:
            - air

    build:
        desc: Build the UI and compile the single self-contained binary (embeds ui/dist)
        deps: [client:build]
        cmds:
            - go build -o maildebug .

    start:
        desc: Build and run the fully built app locally (no Docker) — SMTP + HTTP + embedded UI
        deps: [build]
        cmds:
            - ./maildebug

    test:
        dir: email-test
        cmds:
            - bun run send.tsx --email {{.CLI_ARGS}}

    test:e2e:
        desc: Integration tests — spawn maildebug, send real emails, assert capture
        dir: email-test
        cmds:
            - bun test

    docker:buildx:
        desc: Ensure a multi-platform buildx builder is available
        cmds:
            - |
                if ! docker buildx inspect maildebug-builder >/dev/null 2>&1; then
                    docker buildx create --name maildebug-builder --use
                else
                    docker buildx use maildebug-builder
                fi

    docker:build:
        desc: Build image locally for the current architecture
        vars:
            REPO: '{{.REPO | default "bazo/maildebug"}}'
            BRANCH:
                sh: git rev-parse --abbrev-ref HEAD | tr '/' '-'
            SHA:
                sh: git rev-parse --short HEAD
        cmds:
            - docker build -t maildebug -t {{.REPO}}:latest -t {{.REPO}}:{{.BRANCH}}-{{.SHA}} .

    docker:push:
        desc: Build and push multi-platform image to DockerHub
        deps: [docker:buildx]
        vars:
            REPO: '{{.REPO | default "bazo/maildebug"}}'
            BRANCH:
                sh: git rev-parse --abbrev-ref HEAD | tr '/' '-'
            SHA:
                sh: git rev-parse --short HEAD
        cmds:
            - docker buildx build --platform linux/amd64,linux/arm64 -t {{.REPO}}:latest -t {{.REPO}}:{{.BRANCH}}-{{.SHA}} --push .

    doctor:
        desc: "Run React Doctor over the ui workspace, verbose"
        cmds:
            - bun run doctor -- --verbose {{.CLI_ARGS}}
