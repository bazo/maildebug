pre-commit:
    parallel: true
    commands:
        react-doctor:
            run: react_doctor_output=$(mktemp "${TMPDIR:-/tmp}/react-doctor-hook.XXXXXX"); if react-doctor --staged --blocking warning > "$react_doctor_output" 2>&1; then rm -f "$react_doctor_output"; else cat "$react_doctor_output" >&2; rm -f "$react_doctor_output"; printf "%s\n" "React Doctor found staged regressions." "Run react-doctor --staged --blocking warning to inspect." "Want them fixed? Ask your agent to run that command and resolve the findings." >&2; fi

        oxfmt:
            glob: "*.{js,jsx,ts,tsx,json}"
            run: bunx oxfmt -c .oxfmtrc.json {staged_files}
            stage_fixed: true

        oxlint:
            glob: "*.{js,jsx,ts,tsx}"
            run: bunx oxlint -c .oxlintrc.json {staged_files}

        tsc:
            glob: "ui/**/*.{ts,tsx}"
            root: "ui/"
            run: bunx tsc -b --noEmit

        gofmt:
            glob: "*.go"
            run: |
                unformatted=$(gofmt -l {staged_files})
                if [ -n "$unformatted" ]; then
                    echo "Go files need formatting:"
                    echo "$unformatted"
                    exit 1
                fi

        govet:
            glob: "*.go"
            run: go vet ./...

        gobuild:
            glob: "*.go"
            run: go build ./...

pre-push:
    parallel: true
    commands:
        tsc:
            glob: "ui/**/*.{ts,tsx}"
            root: "ui/"
            run: bunx tsc -b --noEmit

        gobuild:
            glob: "*.go"
            run: go build ./...
